{% extends "base.html" %}
{% block title %}Удалить сообщение{% endblock %}
{% block content %}
  <h1 class="mb-3">Удалить сообщение</h1>
  <p>Вы уверены, что хотите удалить "{{ object }}"?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'messages_list' %}" class="btn btn-outline-secondary">Отмена</a>
  </form>
{% endblock %}
