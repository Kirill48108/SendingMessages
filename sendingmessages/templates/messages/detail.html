={% extends "base.html" %}
{% block title %}Сообщение #{{ message.id }}{% endblock %}
{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="m-0">Сообщение #{{ message.id }}</h1>
    <div>
      <a href="{% url 'messages_update' pk=message.pk %}" class="btn btn-warning">Редактировать</a>
      <form action="{% url 'messages_delete' pk=message.pk %}" method="post" class="d-inline">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger" onclick="return confirm('Удалить сообщение?')">Удалить</button>
      </form>
    </div>
  </div>
  <dl class="row">
    <dt class="col-sm-3">Тема</dt><dd class="col-sm-9">{{ message.subject }}</dd>
    <dt class="col-sm-3">Текст</dt><dd class="col-sm-9"><pre class="mb-0">{{ message.body }}</pre></dd>
  </dl>
  <a href="{% url 'messages_list' %}" class="btn btn-outline-secondary">Назад</a>
{% endblock %}
