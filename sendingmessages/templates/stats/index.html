{% extends "base.html" %}
{% block title %}Статистика{% endblock %}
{% block content %}
  <h1 class="mb-4">Статистика</h1>
  <div class="row g-3">
    <div class="col-12 col-md-4">
      <div class="card h-100">
        <div class="card-body">
          <div class="h6 text-muted">Всего рассылок</div>
          <div class="display-6">{{ mailings_count }}</div>
        </div>
      </div>
    </div>
    <div class="col-12 col-md-4">
      <div class="card h-100">
        <div class="card-body">
          <div class="h6 text-muted">Успешные отправки</div>
          <div class="display-6 text-success">{{ attempts_success }}</div>
        </div>
      </div>
    </div>
    <div class="col-12 col-md-4">
      <div class="card h-100">
        <div class="card-body">
          <div class="h6 text-muted">Ошибки отправки</div>
          <div class="display-6 text-danger">{{ attempts_failed }}</div>
        </div>
      </div>
    </div>
  </div>
  <div class="mt-3">
    <span class="text-muted">Всего попыток: {{ attempts_total }}</span>
  </div>
{% endblock %}
