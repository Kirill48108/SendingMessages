{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
  <h1 class="mb-3">Вход</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.non_field_errors }}
    <div class="mb-3">
      <label for="id_username" class="form-label">Логин или Email</label>
      {{ form.username }}
      {{ form.username.errors }}
    </div>
    <div class="mb-3">
      <label for="id_password" class="form-label">Пароль</label>
      {{ form.password }}
      {{ form.password.errors }}
    </div>
    <button type="submit" class="btn btn-primary">Войти</button>
    <a href="{% url 'password_reset' %}" class="btn btn-link">Забыли пароль?</a>
    <a href="{% url 'signup' %}" class="btn btn-outline-secondary">Создать аккаунт</a>
  </form>
{% endblock %}
