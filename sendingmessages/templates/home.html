{% extends "base.html" %}
{% block title %}Главная - SendingMessages{% endblock %}
{% block content %}
  <h1 class="mb-4">Добро пожаловать</h1>
  <div class="row g-3">
    <div class="col-12 col-md-4">
      <div class="card h-100">
        <div class="card-body">
          <div class="h6 text-muted">Всего рассылок</div>
          <div class="display-6">{{ mailings_total }}</div>
        </div>
      </div>
    </div>
    <div class="col-12 col-md-4">
      <div class="card h-100">
        <div class="card-body">
          <div class="h6 text-muted">Активных</div>
          <div class="display-6">{{ mailings_active }}</div>
        </div>
      </div>
    </div>
    <div class="col-12 col-md-4">
      <div class="card h-100">
        <div class="card-body">
          <div class="h6 text-muted">Уникальных получателей</div>
          <div class="display-6">{{ unique_recipients }}</div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
