{% extends "base.html" %}
{% block title %}Восстановление пароля{% endblock %}
{% block content %}
<div class="container py-4" style="max-width: 560px;">
  <div class="card shadow-sm">
    <div class="card-body">
      <h1 class="h4 mb-3">Восстановление пароля</h1>
      <p class="text-muted">Укажите e‑mail, на него придёт ссылка для сброса пароля.</p>
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label" for="{{ form.email.id_for_label }}">Email</label>
          {{ form.email|add_class:"form-control" }}
          <div class="text-danger small">{{ form.email.errors }}</div>
        </div>
        <button class="btn btn-primary">Отправить ссылку</button>
        <a href="{% url 'login' %}" class="btn btn-outline-secondary">Ко входу</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
