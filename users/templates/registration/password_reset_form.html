{% extends "base.html" %}

{% block content %}
<div class="container mt-4" style="max-width:540px;">
  <h1 class="mb-3">Сброс пароля</h1>
  <p>Введите адрес электронной почты, и мы отправим вам инструкции по смене пароля.</p>

  <form method="post">
    {% csrf_token %}
    {{ form.email.errors }}
    <div class="mb-3">
      <label class="form-label" for="{{ form.email.id_for_label }}">Email</label>
      {{ form.email }}
    </div>
    <button class="btn btn-primary" type="submit">Отправить</button>
    <a class="btn btn-secondary ms-2" href="{% url 'users:login' %}">Отмена</a>
  </form>
</div>
{% endblock %}
